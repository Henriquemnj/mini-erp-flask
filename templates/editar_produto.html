<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar produto | Mini ERP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Editar produto</h1>
        <p>Mini ERP</p>
    </header>

    <main>
        <a href="{{ url_for('produtos') }}">Voltar para produtos</a>

        <form method="POST">
            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ produto.nome }}"
                required
            >

            <label for="descricao">Descrição:</label>
            <input
                type="text"
                id="descricao"
                name="descricao"
                value="{{ produto.descricao or '' }}"
            >

            <label for="preco">Preço:</label>
            <input
                type="number"
                id="preco"
                name="preco"
                value="{{ produto.preco }}"
                min="0"
                step="0.01"
                required
            >

            <label for="quantidade">Quantidade:</label>
            <input
                type="number"
                id="quantidade"
                name="quantidade"
                value="{{ produto.quantidade }}"
                min="0"
                required
            >

            <button type="submit">Salvar alterações</button>
        </form>
    </main>
</body>
</html>
